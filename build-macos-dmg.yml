name: Build SleepGuard macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build DMG (${{ matrix.arch_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch_name: arm64
            qt_arch: clang_64
          - runner: macos-15-intel
            arch_name: x86_64
            qt_arch: clang_64

    runs-on: ${{ matrix.runner }}
    env:
      QT_VERSION: '6.8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: 'qtconnectivity'
          setup-python: false
          set-env: true
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create app and DMG
        run: |
          chmod +x deploy_macos.sh
          ./deploy_macos.sh

          test -d build/SleepGuard.app
          test -f build/SleepGuard.dmg
          mv build/SleepGuard.dmg "build/SleepGuard-${{ matrix.arch_name }}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SleepGuard-macOS-${{ matrix.arch_name }}
          path: build/SleepGuard-${{ matrix.arch_name }}.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: SleepGuard-macOS-app-${{ matrix.arch_name }}
          path: build/SleepGuard.app
          if-no-files-found: error
          retention-days: 14
